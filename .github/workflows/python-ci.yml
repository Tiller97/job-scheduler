name: Python CI

# Triggers: run this workflow on push and pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Run Python job scheduler
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Upgrade pip (best practice)
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Smoke test: run the scheduler and make sure it does not crash
      - name: Run job scheduler
        working-directory: backend
        run: python app.py

      # 5. Sanity check: JobFactory exposes the expected job types
      - name: Test JobFactory
        working-directory: backend
        run: |
          python -c "
          from factory import JobFactory
          assert 'email' in JobFactory.available_types()
          assert 'data' in JobFactory.available_types()
          assert 'priority' in JobFactory.available_types()
          print('JobFactory test passed')
          "
